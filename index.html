<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DarkX - YouTube Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --secondary: #ff3366;
            --background: #121212;
            --surface: #1e1e1e;
            --surface-light: #2a2a2a;
            --text: #ffffff;
            --text-secondary: #b0b0b0;
            --border: #333333;
            --success: #00ff88;
            --error: #ff3366;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            --radius: 16px;
            --radius-small: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            max-width: 100vw;
            overflow-x: hidden;
            position: relative;
        }

        /* App Header */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary), #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-logo i {
            font-size: 1.8rem;
        }

        /* Streaming Button */
        .streaming-btn {
            margin-left: auto;
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--secondary), #ff0066);
            color: white;
            border: none;
            border-radius: var(--radius-small);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
        }

        .streaming-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.4);
        }

        .streaming-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(255, 51, 102, 0.3);
        }

        /* Main Container */
        .app-container {
            max-width: 500px;
            margin: 80px auto 20px;
            padding: 0 20px;
        }

        /* Search Card */
        .search-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .search-title {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-title i {
            color: var(--primary);
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        #videoInput {
            width: 100%;
            padding: 18px 20px 18px 50px;
            background: var(--surface-light);
            border: 2px solid var(--border);
            border-radius: var(--radius-small);
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s;
        }

        #videoInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        #videoInput::placeholder {
            color: var(--text-secondary);
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 1.2rem;
        }

        #downloadBtn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: var(--radius-small);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        #downloadBtn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(0, 212, 255, 0.3);
        }

        #downloadBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Result Card */
        .result-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 25px;
            margin-top: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: none;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .video-header {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .video-thumbnail {
            width: 120px;
            height: 80px;
            border-radius: var(--radius-small);
            object-fit: cover;
            border: 2px solid var(--border);
        }

        .video-info {
            flex: 1;
            min-width: 0;
        }

        .video-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Quality Selector */
        .quality-selector {
            margin: 25px 0;
        }

        .quality-title {
            font-size: 1rem;
            margin-bottom: 15px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quality-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        .quality-option {
            padding: 12px;
            background: var(--surface-light);
            border: 2px solid var(--border);
            border-radius: var(--radius-small);
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quality-option:hover {
            border-color: var(--primary);
        }

        .quality-option.selected {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-color: transparent;
        }

        /* Download Button */
        .download-main-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--success), #00cc66);
            color: white;
            border: none;
            border-radius: var(--radius-small);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
            text-decoration: none;
        }

        .download-main-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(0, 255, 136, 0.3);
        }

        /* Message Toast */
        .toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            padding: 16px 20px;
            border-radius: var(--radius-small);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            animation: slideDown 0.3s ease;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast.success {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        .toast.error {
            background: rgba(255, 51, 102, 0.1);
            border-color: var(--error);
            color: var(--error);
        }

        /* Recent Downloads */
        .recent-section {
            margin-top: 30px;
            display: none;
        }

        .section-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--surface);
            border-radius: var(--radius-small);
            border: 1px solid var(--border);
        }

        .recent-thumb {
            width: 60px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        .recent-info {
            flex: 1;
            min-width: 0;
        }

        .recent-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-quality {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Footer */
        .app-footer {
            text-align: center;
            padding: 25px 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: 30px;
        }

        /* Mobile Optimizations */
        @media (max-width: 480px) {
            .app-container {
                margin: 70px auto 15px;
                padding: 0 15px;
            }
            
            .search-card,
            .result-card {
                padding: 20px;
            }
            
            .video-header {
                flex-direction: column;
            }
            
            .video-thumbnail {
                width: 100%;
                height: 180px;
            }
            
            .quality-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .streaming-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            
            .streaming-btn span {
                display: none;
            }
            
            .streaming-btn i {
                margin-right: 0;
            }
        }

        /* Dark Mode Enhancements */
        @media (prefers-color-scheme: dark) {
            :root {
                --background: #0a0a0a;
                --surface: #151515;
                --surface-light: #202020;
            }
        }

        /* Smooth Transitions */
        * {
            transition: background-color 0.3s, border-color 0.3s;
        }
    </style>
</head>
<body>
    <!-- App Header -->
    <header class="app-header">
        <div class="app-logo">
            <i class="fas fa-bolt"></i>
            <span>DarkX</span>
        </div>
        
        <!-- Streaming Button -->
        <a href="https://musicstreamdx.netlify.app/" target="_blank" class="streaming-btn">
            <i class="fas fa-music"></i>
            <span>Stream Music</span>
        </a>
    </header>

    <!-- Toast Messages -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Main App Container -->
    <div class="app-container">
        <!-- Search Card -->
        <div class="search-card">
            <h2 class="search-title">
                <i class="fas fa-download"></i>
                Download YouTube Videos
            </h2>
            
            <div class="input-group">
                <i class="fas fa-link input-icon"></i>
                <input type="text" 
                       id="videoInput" 
                       placeholder="Paste YouTube URL here..."
                       autocomplete="off"
                       autocapitalize="off"
                       spellcheck="false">
            </div>
            
            <button id="downloadBtn" onclick="downloadVideo()">
                <i class="fas fa-cloud-download-alt"></i>
                Get Video
            </button>
        </div>

        <!-- Loading State -->
        <div class="loading-state" id="loadingState">
            <div class="loading-spinner"></div>
            <p>Processing your video...</p>
        </div>

        <!-- Results Card -->
        <div class="result-card" id="resultCard">
            <div class="video-header">
                <img src="" alt="Thumbnail" class="video-thumbnail" id="videoThumbnail">
                <div class="video-info">
                    <h3 class="video-title" id="videoTitle">Video Title</h3>
                    <div class="video-meta">
                        <span class="meta-item" id="videoDuration">
                            <i class="far fa-clock"></i> 0:00
                        </span>
                        <span class="meta-item" id="videoViews">
                            <i class="fas fa-eye"></i> 0
                        </span>
                    </div>
                </div>
            </div>

            <div class="quality-selector" id="qualitySelector">
                <h4 class="quality-title">
                    <i class="fas fa-hd"></i>
                    Select Quality
                </h4>
                <div class="quality-grid" id="qualityGrid">
                    <!-- Quality options will be added here -->
                </div>
            </div>

            <a href="#" id="downloadLink" class="download-main-btn">
                <i class="fas fa-download"></i>
                <span id="downloadText">Download Video</span>
            </a>
        </div>

        <!-- Recent Downloads (Optional) -->
        <div class="recent-section" id="recentSection">
            <h4 class="section-title">
                <i class="fas fa-history"></i>
                Recent Downloads
            </h4>
            <div class="recent-list" id="recentList">
                <!-- Recent items will be added here -->
            </div>
        </div>
    </div>

    <!-- App Footer -->
    <footer class="app-footer">
        <p>© 2024 DarkX Downloader | For Personal Use</p>
        <p>Downloaded videos are for personal viewing only</p>
    </footer>

    <script>
        // App State
        let currentVideoData = null;
        let selectedQuality = '360';
        let recentDownloads = [];

        // DOM Elements
        const videoInput = document.getElementById('videoInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const loadingState = document.getElementById('loadingState');
        const resultCard = document.getElementById('resultCard');
        const qualityGrid = document.getElementById('qualityGrid');
        const downloadLink = document.getElementById('downloadLink');
        const downloadText = document.getElementById('downloadText');
        const videoThumbnail = document.getElementById('videoThumbnail');
        const videoTitle = document.getElementById('videoTitle');
        const videoDuration = document.getElementById('videoDuration');
        const videoViews = document.getElementById('videoViews');
        const recentSection = document.getElementById('recentSection');
        const recentList = document.getElementById('recentList');
        const toastContainer = document.getElementById('toastContainer');

        // Initialize App
        function initApp() {
            loadRecentDownloads();
            setupEventListeners();
            
            // Focus on input on app start
            setTimeout(() => videoInput.focus(), 500);
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Enter key to download
            videoInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') downloadVideo();
            });

            // Input validation
            videoInput.addEventListener('input', (e) => {
                downloadBtn.disabled = !e.target.value.trim();
            });

            // Prevent right-click on download button
            downloadLink.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });
        }

        // Show Toast Message
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                <span>${message}</span>
            `;

            toastContainer.appendChild(toast);

            // Auto remove after 4 seconds
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Show/Hide Loading
        function setLoading(isLoading) {
            loadingState.style.display = isLoading ? 'block' : 'none';
            downloadBtn.disabled = isLoading;
            downloadBtn.innerHTML = isLoading 
                ? '<i class="fas fa-spinner fa-spin"></i> Processing...' 
                : '<i class="fas fa-cloud-download-alt"></i> Get Video';
        }

        // Download Video Function
        async function downloadVideo() {
            const query = videoInput.value.trim();
            
            if (!query) {
                showToast('Please enter a YouTube URL', 'error');
                videoInput.focus();
                return;
            }

            // Show loading
            setLoading(true);
            resultCard.style.display = 'none';

            try {
                // Use YouTube download API
                const apiUrl = `https://yt-dl.officialhectormanuel.workers.dev/?url=${encodeURIComponent(query)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data.status || !data.videos) {
                    throw new Error(data.message || 'Failed to fetch video');
                }

                // Store video data
                currentVideoData = data;

                // Update UI
                updateVideoUI(data);
                updateQualityOptions(data.videos);
                updateDownloadLink(selectedQuality);

                // Show results
                resultCard.style.display = 'block';
                showToast('Video ready to download!', 'success');

                // Add to recent downloads
                addToRecentDownloads(data);

            } catch (error) {
                console.error('Download error:', error);
                showToast(`Error: ${error.message}`, 'error');
            } finally {
                setLoading(false);
            }
        }

        // Update Video UI
        function updateVideoUI(data) {
            videoTitle.textContent = data.title || 'Untitled Video';
            
            if (data.thumbnail) {
                videoThumbnail.src = data.thumbnail;
                videoThumbnail.onerror = () => {
                    videoThumbnail.src = 'https://via.placeholder.com/300x200/1e1e1e/666666?text=No+Thumbnail';
                };
            }

            // Format duration
            const duration = data.duration || data.length_seconds;
            const durationText = formatDuration(duration);
            videoDuration.innerHTML = `<i class="far fa-clock"></i> ${durationText}`;

            // Format views
            const views = data.view_count;
            const viewsText = formatViews(views);
            videoViews.innerHTML = `<i class="fas fa-eye"></i> ${viewsText}`;
        }

        // Update Quality Options
        function updateQualityOptions(videos) {
            qualityGrid.innerHTML = '';
            
            const qualities = Object.keys(videos)
                .filter(q => videos[q])
                .sort((a, b) => parseInt(b) - parseInt(a));

            qualities.forEach(quality => {
                const option = document.createElement('div');
                option.className = `quality-option ${quality === selectedQuality ? 'selected' : ''}`;
                option.textContent = `${quality}p`;
                option.dataset.quality = quality;
                
                option.onclick = () => selectQuality(quality);
                qualityGrid.appendChild(option);
            });

            // Show/hide quality selector
            qualityGrid.parentElement.style.display = qualities.length > 1 ? 'block' : 'none';
        }

        // Select Quality
        function selectQuality(quality) {
            selectedQuality = quality;
            
            // Update UI
            document.querySelectorAll('.quality-option').forEach(option => {
                option.classList.remove('selected');
                if (option.dataset.quality === quality) {
                    option.classList.add('selected');
                }
            });

            // Update download link
            updateDownloadLink(quality);
            showToast(`Quality set to ${quality}p`, 'success');
        }

        // Update Download Link
        function updateDownloadLink(quality) {
            if (!currentVideoData || !currentVideoData.videos[quality]) return;
            
            const videoUrl = currentVideoData.videos[quality];
            const title = currentVideoData.title || 'video';
            const safeTitle = title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            
            downloadLink.href = videoUrl;
            downloadLink.download = `${safeTitle}_${quality}p.mp4`;
            downloadText.textContent = `Download ${quality}p Video`;
        }

        // Track Download
        function trackDownload() {
            if (!currentVideoData) return;
            
            showToast('Starting download...', 'success');
            
            // Add to recent downloads
            addToRecentDownloads(currentVideoData);
            
            // Analytics (optional)
            console.log(`Download tracked: ${currentVideoData.title} at ${selectedQuality}p`);
        }

        // Format Duration
        function formatDuration(seconds) {
            if (!seconds) return 'N/A';
            
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        // Format Views
        function formatViews(views) {
            if (!views) return 'N/A';
            
            if (views >= 1000000000) {
                return (views / 1000000000).toFixed(1) + 'B';
            }
            if (views >= 1000000) {
                return (views / 1000000).toFixed(1) + 'M';
            }
            if (views >= 1000) {
                return (views / 1000).toFixed(1) + 'K';
            }
            return views;
        }

        // Recent Downloads Functions
        function addToRecentDownloads(videoData) {
            const recentItem = {
                id: Date.now(),
                title: videoData.title,
                thumbnail: videoData.thumbnail,
                quality: selectedQuality,
                date: new Date().toLocaleString(),
                url: videoData.videos[selectedQuality]
            };

            recentDownloads.unshift(recentItem);
            recentDownloads = recentDownloads.slice(0, 5); // Keep only 5 most recent
            
            saveRecentDownloads();
            updateRecentDownloadsUI();
        }

        function saveRecentDownloads() {
            try {
                localStorage.setItem('darkx_recent_downloads', JSON.stringify(recentDownloads));
            } catch (e) {
                console.warn('Could not save to localStorage:', e);
            }
        }

        function loadRecentDownloads() {
            try {
                const saved = localStorage.getItem('darkx_recent_downloads');
                if (saved) {
                    recentDownloads = JSON.parse(saved);
                    updateRecentDownloadsUI();
                }
            } catch (e) {
                console.warn('Could not load from localStorage:', e);
            }
        }

        function updateRecentDownloadsUI() {
            if (recentDownloads.length === 0) {
                recentSection.style.display = 'none';
                return;
            }

            recentSection.style.display = 'block';
            recentList.innerHTML = '';

            recentDownloads.forEach(item => {
                const recentItem = document.createElement('div');
                recentItem.className = 'recent-item';
                recentItem.innerHTML = `
                    <img src="${item.thumbnail}" alt="${item.title}" class="recent-thumb" 
                         onerror="this.src='https://via.placeholder.com/60x40/1e1e1e/666666?text=Video'">
                    <div class="recent-info">
                        <div class="recent-name">${item.title}</div>
                        <div class="recent-quality">${item.quality}p • ${item.date}</div>
                    </div>
                    <i class="fas fa-redo-alt" style="color: var(--primary); cursor: pointer;" 
                       onclick="reDownload('${item.url}', '${item.title}')"></i>
                `;
                recentList.appendChild(recentItem);
            });
        }

        // Re-download from recent
        function reDownload(url, title) {
            const a = document.createElement('a');
            a.href = url;
            a.download = `${title.replace(/[^a-z0-9]/gi, '_')}.mp4`;
            a.click();
            showToast('Starting re-download...', 'success');
        }

        // Initialize app when page loads
        document.addEventListener('DOMContentLoaded', initApp);

        // Add download tracking
        downloadLink.addEventListener('click', trackDownload);
    </script>
</body>
    </html>
