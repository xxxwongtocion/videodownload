<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DarkX TikTok Video Downloader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 480px;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(45deg, #ff0050, #00f2fe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
    letter-spacing: 1px;
}

.tagline {
    color: #888;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.card {
    background: rgba(28, 28, 28, 0.8);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.input-group {
    margin-bottom: 20px;
}

.input-label {
    display: block;
    margin-bottom: 8px;
    color: #ddd;
    font-size: 14px;
    font-weight: 500;
}

.input-field {
    width: 100%;
    padding: 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    transition: all 0.3s ease;
}

.input-field:focus {
    outline: none;
    border-color: #ff0050;
    box-shadow: 0 0 0 3px rgba(255, 0, 80, 0.1);
}

.input-field::placeholder {
    color: #666;
}

.download-btn {
    width: 100%;
    padding: 18px;
    background: linear-gradient(45deg, #ff0050, #ff0066);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
}

.download-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 0, 80, 0.3);
}

.download-btn:active {
    transform: translateY(0);
}

.loader {
    display: none;
    text-align: center;
    margin: 25px 0;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top: 4px solid #ff0050;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.result {
    display: none;
    margin-top: 25px;
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.download-link {
    display: block;
    padding: 18px;
    background: linear-gradient(45deg, #00c853, #00e676);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    transition: all 0.3s ease;
    margin-top: 10px;
}

.download-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 200, 83, 0.3);
}

.coming-soon {
    background: rgba(255, 255, 255, 0.05);
    padding: 15px;
    border-radius: 10px;
    margin-top: 25px;
    text-align: center;
    border-left: 4px solid #0095f6;
}

.coming-soon h3 {
    color: #0095f6;
    margin-bottom: 5px;
    font-size: 16px;
}

.coming-soon p {
    color: #aaa;
    font-size: 14px;
}

.instagram-icon {
    display: inline-block;
    background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: bold;
    font-size: 18px;
}

.footer {
    text-align: center;
    margin-top: 30px;
    color: #666;
    font-size: 12px;
}

.error-message {
    color: #ff6b6b;
    font-size: 14px;
    margin-top: 10px;
    display: none;
    text-align: center;
    padding: 10px;
    background: rgba(255, 107, 107, 0.1);
    border-radius: 8px;
    border: 1px solid rgba(255, 107, 107, 0.2);
}

.success-message {
    color: #00c853;
    font-size: 14px;
    margin-top: 10px;
    text-align: center;
    padding: 10px;
    background: rgba(0, 200, 83, 0.1);
    border-radius: 8px;
    border: 1px solid rgba(0, 200, 83, 0.2);
    display: none;
}
</style>
</head>

<body>
<div class="container">
    <div class="header">
        <div class="logo">DARKX</div>
        <div class="tagline">TikTok Video Downloader</div>
    </div>
    
    <div class="card">
        <div class="input-group">
            <label class="input-label">Paste TikTok Video URL</label>
            <input type="text" id="url" class="input-field" placeholder="https://www.tiktok.com/@username/video/1234567890">
        </div>
        
        <button class="download-btn" onclick="downloadVideo()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download Video
        </button>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Processing your request...</p>
        </div>
        
        <div class="result" id="result">
            <a class="download-link" id="downloadLink" target="_blank">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                Download HD Video
            </a>
        </div>
        
        <div class="coming-soon">
            <h3>📸 <span class="instagram-icon">Instagram</span> Video Downloader</h3>
            <p>Coming Soon! We're working on Instagram support.</p>
        </div>
    </div>
    
    <div class="footer">
        <p>DarkX Downloader © 2024 | Download TikTok videos without watermark</p>
    </div>
</div>

<script>
async function downloadVideo() {
    const url = document.getElementById("url").value.trim();
    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");
    const loader = document.getElementById("loader");
    const result = document.getElementById("result");
    const downloadLink = document.getElementById("downloadLink");
    
    // Reset messages
    errorMessage.style.display = 'none';
    successMessage.style.display = 'none';
    result.style.display = 'none';
    
    // Validate URL
    if (!url) {
        errorMessage.textContent = 'Please paste a TikTok video link';
        errorMessage.style.display = 'block';
        return;
    }
    
    if (!url.includes('tiktok.com')) {
        errorMessage.textContent = 'Please enter a valid TikTok URL';
        errorMessage.style.display = 'block';
        return;
    }
    
    // Show loader
    loader.style.display = 'block';
    
    try {
        const api = "https://www.tikwm.com/api/?url=" + encodeURIComponent(url);
        const res = await fetch(api);
        const data = await res.json();
        
        if (!data || !data.data || !data.data.play) {
            throw new Error('Video not found or private');
        }
        
        // Show success message
        successMessage.textContent = '✓ Video ready to download!';
        successMessage.style.display = 'block';
        
        // Set download link
        downloadLink.href = data.data.play;
        downloadLink.download = 'tiktok_video.mp4';
        
        // Show result
        result.style.display = 'block';
        
    } catch (error) {
        errorMessage.textContent = 'Error: ' + error.message;
        errorMessage.style.display = 'block';
    } finally {
        loader.style.display = 'none';
    }
}

// Allow pressing Enter to trigger download
document.getElementById('url').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        downloadVideo();
    }
});

// Clear error message when user starts typing
document.getElementById('url').addEventListener('input', function() {
    document.getElementById('errorMessage').style.display = 'none';
});
</script>
</body>
                    </html>
