<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikTok Video Downloader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0f0f0f;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .box {
        background: #1c1c1c;
        padding: 20px;
        border-radius: 10px;
        width: 100%;
        max-width: 400px;
        text-align: center;
    }
    input {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: none;
        margin-bottom: 10px;
    }
    button {
        width: 100%;
        padding: 10px;
        background: #ff0050;
        border: none;
        color: #fff;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
    }
    a {
        display: none;
        margin-top: 15px;
        padding: 10px;
        background: #00c853;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
    }
</style>
</head>

<body>
<div class="box">
    <h2>TikTok Downloader</h2>

    <input type="text" id="url" placeholder="Paste TikTok Video Link">

    <button onclick="download()">Download</button>

    <a id="downloadLink" target="_blank">Download Video</a>
</div>

<script>
async function download() {
    const url = document.getElementById("url").value;
    if (!url) return alert("Weka TikTok link");

    const api = `https://api.tiklydown.me/api/download?url=${encodeURIComponent(url)}`;

    try {
        const res = await fetch(api);
        const data = await res.json();

        if (!data.video || !data.video.noWatermark) {
            alert("Imeshindikana kupakua video");
            return;
        }

        const link = document.getElementById("downloadLink");
        link.href = data.video.noWatermark;
        link.style.display = "block";
    } catch (e) {
        alert("Error: API haipatikani");
    }
}
</script>
</body>
</html>
